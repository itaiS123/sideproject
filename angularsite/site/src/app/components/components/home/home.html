<div class="home-container">
  <div class="home-card">
    <div class="welcome-header">
      <h1>Welcome back, {{ userName }}! 👋</h1>
      <p>System Status: <span class="status-online">Online</span></p>
    </div>

    <div class="action-buttons">
      <button class="btn workspace-btn" (click)="goToWorkspace()">
        <span class="icon">🚀</span>
        Open Workspace
      </button>

      <button class="btn notebook-btn" (click)="goToNotebooks()">
        <span class="icon">📚</span>
        Manage Notebooks
      </button>

      <button class="btn secondary-btn" (click)="logout()">
        <span class="icon">⬅️</span>
        Logout
      </button>
    </div>
  </div>
</div>
