<div class="notebooks-page">
  <div class="glass-card">
    <header class="nb-header">
      <button class="back-btn" (click)="goBack()">⬅ Back to Home</button>
      <h1>My Notebooks</h1>
      <p>Organize your subjects for AI analysis</p>
    </header>

    <div class="add-notebook-box">
      <input
        type="text"
        [(ngModel)]="newNotebookName"
        placeholder="Subject Name (e.g., Linear Algebra)"
      >
      <button class="add-btn" (click)="createNotebook()">+ Create</button>
    </div>

    <div class="notebooks-grid">
      <div
        *ngFor="let nb of notebooks"
        class="notebook-item"
        (click)="openNotebook(nb._id)"
        style="cursor: pointer;"
      >
        <div class="nb-icon">📓</div>
        <div class="nb-info">
          <h3>{{ nb.name }}</h3>
          <span class="status-tag">Created in testDB</span>
        </div>
      </div>

      <div *ngIf="notebooks.length === 0" class="empty-msg">
        No notebooks yet. Start by creating one!
      </div>
    </div>
  </div>
</div>
